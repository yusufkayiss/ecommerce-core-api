services:
  postgres:
    image: 'postgres:latest'
    environment:
      - POSTGRES_DB=ecommerce_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5432:5432'

  redis:
    image: 'redis:7-alpine'
    container_name: ecommerce-redis
    ports:
      - '6379:6379'